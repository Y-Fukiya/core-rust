name: Open Rules Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-skip-fixes:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cdisc-org/cdisc-open-rules
          ref: 1881cb9a1f9a38b6cafc785eca5169b240981f66
          path: target/skip-candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Run workspace regressions
        run: cargo test --workspace --locked
      - name: Verify the candidate patch paths and checksums before replay
        shell: bash
        run: |
          set -euo pipefail
          review=tests/open_rules/diagnostic/accepted-review
          mkdir -p target/skip-fix-evidence
          git clone --shared --no-checkout target/skip-candidate target/skip-proposal
          git -C target/skip-proposal checkout --detach 1881cb9a1f9a38b6cafc785eca5169b240981f66
          for patch in candidate-existing metadata-order-oracles; do
            gzip -dc "$review/$patch.patch.gz" > "target/$patch.patch"
            git -C target/skip-proposal apply --check "$PWD/target/$patch.patch"
            git -C target/skip-proposal apply "$PWD/target/$patch.patch"
          done
          gzip -dc "$review/metadata-order-oracles.json.gz" > target/skip-fix-evidence/metadata-order-oracles.json
          python3 scripts/verify_candidate_open_rules_skip_fixes.py \
            --manifest target/skip-fix-evidence/metadata-order-oracles.json overlay \
            --raw target/skip-candidate --proposal target/skip-proposal \
            --profile tests/open_rules/diagnostic/cdisc-v1-candidate.json --previous "$review/candidate-existing.json"
      - name: Replay metadata and column order with pinned official CORE
        shell: bash
        run: |
          set -euo pipefail
          review=tests/open_rules/diagnostic/accepted-review
          evidence=target/skip-fix-evidence
          profile=tests/open_rules/diagnostic/cdisc-v1-candidate.json
          asset="$(jq -er .engine.asset_url "$profile")"
          curl --fail --location --retry 2 --max-time 120 "$asset" --output target/core-metadata-order.tar.gz
          python3 scripts/review_candidate_open_rules_skips.py --candidate target/skip-candidate \
            --profile "$profile" --archive target/core-metadata-order.tar.gz \
            --plan "$review/candidate-skip-plan.json" --only "$evidence/metadata-order-oracles.json" \
            --out "$evidence/official"
          python3 scripts/verify_candidate_open_rules_skip_fixes.py --manifest "$evidence/metadata-order-oracles.json" \
            official --receipts "$evidence/official" --proposal target/skip-proposal
      - name: Check full candidate default and strict scores
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p xtask
          evidence=target/skip-fix-evidence
          score_status=0
          target/debug/xtask open-rules run-score --open-rules-root target/skip-proposal \
            --core-rs-results-root target/skip-rust --out "$evidence/default" || score_status=$?
          printf '%s\n' "$score_status" > "$evidence/candidate-default-exit.txt"
          test "$score_status" = 1
          strict_status=0
          target/debug/xtask open-rules score --strict-scoring --open-rules-root target/skip-proposal \
            --core-rs-results-root target/skip-rust --out "$evidence/strict" || strict_status=$?
          printf '%s\n' "$strict_status" > "$evidence/candidate-strict-exit.txt"
          python3 scripts/verify_candidate_open_rules_skip_fixes.py --manifest "$evidence/metadata-order-oracles.json" \
            scores --default "$evidence/default/scoreboard.json" --strict "$evidence/strict/scoreboard.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-skip-fix-evidence
          path: target/skip-fix-evidence
          if-no-files-found: error
