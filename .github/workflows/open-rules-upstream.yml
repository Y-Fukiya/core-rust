name: Open Rules Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-review-official:
    uses: ./.github/workflows/open-rules-official-audit.yml

  candidate-review-full-scores:
    name: Full corpus ${{ matrix.lane }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: accepted
            sha: 7f7fae49376b3d023563ebb6c36a3b392d6e649f
          - lane: candidate
            sha: 1881cb9a1f9a38b6cafc785eca5169b240981f66
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: actions/checkout@v7
        with:
          repository: cdisc-org/cdisc-open-rules
          ref: ${{ matrix.sha }}
          path: pinned-open-rules
          persist-credentials: false
      - name: Run raw and strict scores from the pinned corpus
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          CORPUS_SHA: ${{ matrix.sha }}
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          test "$(git -C pinned-open-rules rev-parse HEAD)" = "$CORPUS_SHA"
          git -C pinned-open-rules diff --quiet HEAD --
          cargo build --locked -p xtask
          mkdir -p target/review-evidence
          args=()
          if [[ "$LANE" == accepted ]]; then args+=(--strict-lock); fi
          score_status=0
          target/debug/xtask open-rules run-score \
            --open-rules-root pinned-open-rules \
            --core-rs-results-root target/review-raw-results \
            --out target/review-evidence/raw "${args[@]}" || score_status=$?
          printf '%s\n' "$score_status" > target/review-evidence/raw-exit.txt
          test -s target/review-evidence/raw/scoreboard.json
          strict_status=0
          target/debug/xtask open-rules score --strict-scoring \
            --open-rules-root pinned-open-rules \
            --core-rs-results-root target/review-raw-results \
            --out target/review-evidence/strict || strict_status=$?
          printf '%s\n' "$strict_status" > target/review-evidence/strict-exit.txt
          test -s target/review-evidence/strict/scoreboard.json
          target/debug/xtask open-rules score-delta \
            --default-scoreboard target/review-evidence/raw/scoreboard.json \
            --strict-scoreboard target/review-evidence/strict/scoreboard.json \
            --out target/review-evidence/delta
          if [[ "$LANE" == accepted ]]; then
            target/debug/xtask open-rules baseline \
              --baseline tests/open_rules/upstream-baseline.json \
              --scoreboard target/review-evidence/raw/scoreboard.json \
              | tee target/review-evidence/full-gate.txt
          fi
          exit "$score_status"
      - name: Upload scoring and gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: open-rules-review-${{ matrix.lane }}
          path: target/review-evidence
