name: Open Rules Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-published-mismatches:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cdisc-org/cdisc-open-rules
          ref: 1881cb9a1f9a38b6cafc785eca5169b240981f66
          path: target/published
          persist-credentials: false
      - name: Replay supported cases first, then deferred cases and the ADaMIG control
        shell: bash
        run: |
          set -euo pipefail
          profile=tests/open_rules/diagnostic/cdisc-v1-candidate.json
          review=tests/open_rules/diagnostic/accepted-review
          mkdir -p target/published-mismatch-evidence
          git clone --shared --no-checkout target/published target/reviewed-trial
          git -C target/reviewed-trial checkout --detach 1881cb9a1f9a38b6cafc785eca5169b240981f66
          for patch in candidate-existing relrec-ct-oracles; do
            gzip -dc "$review/$patch.patch.gz" > "target/$patch.patch"
            git -C target/reviewed-trial apply --check "$PWD/target/$patch.patch"
            git -C target/reviewed-trial apply "$PWD/target/$patch.patch"
          done
          gzip -dc "$review/relrec-ct-oracles.json.gz" > target/trial-oracles.json
          curl --fail --location --retry 2 --max-time 120 "$(jq -er .engine.asset_url "$profile")" --output target/core.tar.gz
          python3 scripts/review_published_mismatches.py replay --raw target/published --trial target/reviewed-trial \
            --profile "$profile" --archive target/core.tar.gz --out target/published-mismatch-evidence \
            --scratch target/fresh-reports --older-manifest "$review/candidate-existing.json" \
            --trial-manifest target/trial-oracles.json
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Run Rust workspace regressions
        run: cargo test --workspace --locked
      - name: Execute Rust independently on published and trial inputs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p xtask
          xtask=target/debug/xtask
          evidence=target/published-mismatch-evidence
          for mode in raw trial; do
            src=target/published
            if [ "$mode" = trial ]; then src=target/reviewed-trial; fi
            reports="target/rust-$mode"
            status=0
            "$xtask" open-rules run-score --open-rules-root "$src" --core-rs-results-root "$reports" \
              --out "$evidence/$mode-default" || status=$?
            printf '%s\n' "$status" > "$evidence/$mode-default-exit.txt"
            cp "$reports/run-summary.json" "$evidence/$mode-run-summary.json"
            if [ "$mode" = trial ]; then
              status=0
              "$xtask" open-rules score --strict-scoring --open-rules-root "$src" \
                --core-rs-results-root "$reports" --out "$evidence/trial-strict" || status=$?
              printf '%s\n' "$status" > "$evidence/trial-strict-exit.txt"
            fi
            status=0
            "$xtask" open-rules score --strict-scoring --open-rules-root "target/fresh-reports/$mode" \
              --core-rs-results-root "$reports" --out "$evidence/$mode-fresh" || status=$?
            printf '%s\n' "$status" > "$evidence/$mode-fresh-exit.txt"
          done
          python3 scripts/review_published_mismatches.py report --out "$evidence"
          git -C target/published diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-mismatch-evidence
          path: target/published-mismatch-evidence
          if-no-files-found: error
