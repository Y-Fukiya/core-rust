name: Open Rules Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-skip-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cdisc-org/cdisc-open-rules
          ref: 1881cb9a1f9a38b6cafc785eca5169b240981f66
          path: target/skip-candidate
          persist-credentials: false
      - name: Replay 55 blocking skips, then 49 deferred skips
        shell: bash
        run: |
          set -euo pipefail
          profile=tests/open_rules/diagnostic/cdisc-v1-candidate.json
          asset="$(jq -er .engine.asset_url "$profile")"
          curl --fail --location --retry 2 --max-time 120 "$asset" --output target/core-skip-audit.tar.gz
          python3 scripts/review_candidate_open_rules_skips.py \
            --candidate target/skip-candidate --profile "$profile" \
            --archive target/core-skip-audit.tar.gz \
            --plan tests/open_rules/diagnostic/accepted-review/candidate-skip-plan.json \
            --out target/skip-audit
          jq -e '(.phases.unsupported.cases | length) == 55 and (.phases.deferred.cases | length) == 49' \
            target/skip-audit/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-official-skip-audit
          path: target/skip-audit
          if-no-files-found: error
